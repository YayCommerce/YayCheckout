  - { option: yaycheckout_settings_updated_at, stability: unreviewed }
  - { option: yaycheckout_reviewed, stability: unreviewed }
  - { option: yaycheckout_setup_done, stability: unreviewed }
  - { option: yaycheckout_active_layout, stability: unreviewed }
  - { option: yaycheckout_preview_order_id, stability: unreviewed }

tables: [ ]

# Options this plugin READS and never writes.
reads_foreign:
  - { option: active_plugins, owner: wordpress-core }
  - { option: woocommerce_enable_order_comments, owner: woocommerce }
  - { option: woocommerce_enable_signup_and_login_from_checkout, owner: woocommerce }
  - { option: woocommerce_ship_to_destination, owner: woocommerce }
  - { option: woocommerce_tax_display_cart, owner: woocommerce }
  - { option: woocommerce_tax_total_display, owner: woocommerce }
  - { option: woocommerce_enable_checkout_login_reminder, owner: woocommerce }   # CheckoutLogin::OPTION_REMINDER (constant; scan missed it)

# Hook names built at runtime. A scan cannot resolve these.
dynamic:
  - "includes/Pro/templates/thankyou-page.php:52 'woocommerce_thankyou_' . <runtime> (prefix only)"
  - "includes/Renderer/WcHooks.php:284 $hook"
  - "includes/Renderer/WcHooks.php:395 $hook"
  - "includes/Renderer/WcHooks.php:404 $hook"
  - "packages/blocks/src/slot/render.php:21 'yaycheckout_slot_' . <runtime> (prefix only)"
  # WcHooks re-fires the 30 classic-checkout actions listed in Renderer\WcHooks::HOOKS (WooCommerce's names, not ours).
