  - { route: "yaycheckout/v1/fonts/(?P<slug>[a-z0-9-]+)", stability: unreviewed, at: includes/Controllers/FontRestController.php:16 }
  - { route: "yaycheckout/v1/layouts", stability: unreviewed, at: includes/Controllers/LayoutRestController.php:29 }
  - { route: "yaycheckout/v1/layouts/(?P<id>\\d+)", stability: unreviewed, at: includes/Controllers/LayoutRestController.php:111 }
  - { route: "yaycheckout/v1/layouts/(?P<id>\\d+)/activate", stability: unreviewed, at: includes/Controllers/LayoutRestController.php:149 }
  - { route: "yaycheckout/v1/layouts/(?P<id>\\d+)/archive", stability: unreviewed, at: includes/Controllers/LayoutRestController.php:175 }
