# YayCheckout's public contract: what another plugin, a theme or a customer's snippet may be
# relying on. The reason removing something is a breaking change rather than a tidy-up.
#
# Update when: a hook, route, option or table is added, removed or re-signatured, or a
# stability is reviewed. `/yay:harness-scout --update` re-derives the list; the stabilities are
# human-owned and are never overwritten by a scan.
#
# public | internal | deprecated | unreviewed (the default: unknown, so treat as possibly consumed).
# Review asked 2026-11-09; nothing classified yet (harness.yml needs_confirmation: api.stability).
schema: 1

hooks:
  - { name: yaycheckout_admin_bar_layout, kind: filter, stability: unreviewed, at: includes/Renderer/CheckoutAdminBar.php:42 }
  - { name: yaycheckout_built_blocks, kind: filter, stability: unreviewed, at: includes/Blocks/BlockRegistry.php:211 }
  - { name: yaycheckout_checkout_terms, kind: action, stability: unreviewed, at: packages/blocks/src/terms/render.php:35 }
  - { name: yaycheckout_editor_views, kind: filter, stability: unreviewed, at: includes/Engine/Admin/LayoutEditorEmbed.php:122 }
  - { name: yaycheckout_layout_renders_order_received, kind: filter, stability: unreviewed, at: includes/Renderer/ThemelessCheckout.php:254 }
  - { name: yaycheckout_live_value_labels, kind: filter, stability: unreviewed, at: includes/Renderer/LiveValues.php:129 }
  - { name: yaycheckout_live_values_source, kind: filter, stability: unreviewed, at: includes/Renderer/LiveValues.php:214 }
  - { name: yaycheckout_localize_admin_data, kind: filter, stability: unreviewed, at: includes/Helpers/LocalizeHelper.php:28 }
  - { name: yaycheckout_localize_meta, kind: filter, stability: unreviewed, at: includes/Helpers/LocalizeHelper.php:55 }
  - { name: yaycheckout_order_again_statuses, kind: filter, stability: unreviewed, at: includes/Pro/Renderer/OrderAgain.php:53 }
  - { name: yaycheckout_themeless_checkout, kind: filter, stability: unreviewed, at: includes/Renderer/ThemelessCheckout.php:68 }
  # Built from a class constant, so the literal scan saw only self::FILTER:
  - { name: yaycheckout_integrations, kind: filter, stability: unreviewed, at: includes/Helpers/IntegrationsHelper.php:44 }
  - { name: yaycheckout_plugin_blocks, kind: filter, stability: unreviewed, at: includes/Helpers/PluginBlockCatalogue.php:97 }

