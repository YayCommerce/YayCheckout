name: JS

# Runs only when the admin SPA, the blocks' shared code it imports (@blocks-shared), or the
# workspace setup changes.
#
# The base-branch filter covers dev and the transient hotfix/<X.Y>.x lines /yayhotfix cuts from a
# released tag, so a hotfix PR gets the same checks a dev PR does.
on:
  pull_request:
    branches: [dev, "hotfix/**"]
    paths:
      - 'apps/admin/**'
      - 'packages/blocks/src/shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/js.yml'
  push:
    branches: [dev, "hotfix/**"]
    paths:
      - 'apps/admin/**'
      - 'packages/blocks/src/shared/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/js.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin:
    name: Admin SPA type-check + ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node first: pnpm 11 crashes on Node older than 22 (docs/known-issues.md).
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Version comes from package.json's packageManager (pnpm@11.15.1).
      - uses: pnpm/action-setup@v4

      # --ignore-scripts: the root postinstall runs `composer install`, which needs the private
      # admin-shell repo, and still runs under --filter. tsc and ESLint need no install scripts.
      # No lockfile is tracked (docs/known-issues.md), so no --frozen-lockfile or cache.
      - name: Install dependencies
        run: pnpm install --filter @yaycheckout/admin-page --ignore-scripts

      - name: tsc --noEmit
        run: pnpm --filter @yaycheckout/admin-page exec tsc --noEmit

      # ESLint only: the package's `lint` script also runs `prettier --check`, which fails on dev
      # (docs/known-issues.md). Warnings are shown but don't block.
      - name: ESLint
        run: pnpm --filter @yaycheckout/admin-page exec eslint .
